name: Integrar modulo Mis planeaciones

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrar:
    if: "!contains(github.event.head_commit.message, '[skip integrar]')"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Integrar script en index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="js/mis-planeaciones.js"></script>'
          if tag not in text:
              marker='<script src="js/app.js"></script>'
              if marker not in text:
                  raise SystemExit('No se encontró el punto de inserción de app.js')
              text=text.replace(marker, marker+'\n'+tag, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('El script ya está integrado')
      - name: Publicar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Integrar Mis planeaciones [skip integrar]"
            git push
          fi
